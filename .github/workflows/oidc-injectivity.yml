name: OIDC environment subject injectivity

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  claim:
    strategy:
      fail-fast: false
      matrix:
        environment_name:
          - 'Critical:Prod'
          - 'Critical%3AProd'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ${{ matrix.environment_name }}
    steps:
      - name: Decode and print only non-secret identity claims
        shell: bash
        env:
          EXPECTED_ENVIRONMENT: ${{ matrix.environment_name }}
        run: |
          set -euo pipefail
          response="$({
            curl --fail-with-body --silent --show-error \
              -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=urn%3Aowned%3Aoidc-sub-injectivity"
          })"
          jwt="$(jq -er '.value' <<<"$response")"
          payload="${jwt#*.}"
          payload="${payload%%.*}"
          case $((${#payload} % 4)) in
            2) payload="${payload}==" ;;
            3) payload="${payload}=" ;;
          esac
          claims="$({
            printf '%s' "$payload" \
              | tr '_-' '/+' \
              | base64 --decode \
              | jq -ce --arg expected "$EXPECTED_ENVIRONMENT" \
                  '{expected_environment:$expected,environment,sub,repository_id,repository_owner_id,aud}'
          })"
          printf 'OIDC_CLAIM_JSON=%s\n' "$claims"
