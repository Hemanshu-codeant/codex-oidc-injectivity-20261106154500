name: Owned cross-run exact-sub RP

on:
  workflow_run:
    workflows: [Fork PR OIDC encrypted RP request]
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  authorize:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
      RP_PRIVATE_KEY_B64: ${{ secrets.RP_PRIVATE_KEY_B64 }}
      RP_MARKER: ${{ secrets.RP_MARKER }}
      RP_COMMENT_ID: ${{ vars.RP_COMMENT_ID }}
      API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Download encrypted request from source run
        uses: actions/download-artifact@v4
        with:
          name: oidc-rp-request
          path: /tmp/rp-request
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Verify exact protected subject and exercise protected RP state
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto = require('crypto');
          const fs = require('fs');
          const https = require('https');

          const expectedIssuer = 'https://token.actions.githubusercontent.com';
          const expectedAudience = 'urn:owned:oidc-cross-run-rp';
          const expectedProtectedSubject =
            'repo:Per0x1de-1337@162025236/codex-oidc-injectivity-20261106154500@1448444049:environment:Critical%3AProd';
          const expectedTwinEnvironment = 'Critical%3AProd';
          const baselineState = 'stable-owned-rp-state';

          function getJson(url) {
            return new Promise((resolve, reject) => {
              const request = https.get(url, (response) => {
                let body = '';
                response.setEncoding('utf8');
                response.on('data', (chunk) => { body += chunk; });
                response.on('end', () => {
                  if (response.statusCode < 200 || response.statusCode >= 300) {
                    reject(new Error(`HTTP ${response.statusCode}`));
                    return;
                  }
                  try {
                    resolve(JSON.parse(body));
                  } catch (error) {
                    reject(error);
                  }
                });
              });
              request.on('error', reject);
            });
          }

          async function githubApi(method, path, body) {
            const response = await fetch(`https://api.github.com${path}`, {
              method,
              headers: {
                Accept: 'application/vnd.github+json',
                Authorization: `Bearer ${process.env.API_TOKEN}`,
                'Content-Type': 'application/json',
                'User-Agent': 'owned-oidc-rp-fixture',
                'X-GitHub-Api-Version': '2022-11-28',
              },
              body: body === undefined ? undefined : JSON.stringify(body),
            });
            const text = await response.text();
            const parsed = text ? JSON.parse(text) : {};
            if (!response.ok) throw new Error(`GitHub API ${method} ${path}: HTTP ${response.status}`);
            return parsed;
          }

          async function verifyJwt(jwt) {
            const parts = jwt.split('.');
            if (parts.length !== 3) throw new Error('unexpected JWT structure');
            const header = JSON.parse(Buffer.from(parts[0], 'base64url').toString('utf8'));
            const claims = JSON.parse(Buffer.from(parts[1], 'base64url').toString('utf8'));
            if (header.alg !== 'RS256') throw new Error('unexpected signing algorithm');

            const discovery = await getJson(`${expectedIssuer}/.well-known/openid-configuration`);
            const jwks = await getJson(discovery.jwks_uri);
            const jwk = jwks.keys.find((candidate) => candidate.kid === header.kid);
            if (!jwk) throw new Error('GitHub signing key not found');
            const publicKey = crypto.createPublicKey({ key: jwk, format: 'jwk' });
            const signatureValid = crypto.verify(
              'RSA-SHA256',
              Buffer.from(`${parts[0]}.${parts[1]}`),
              publicKey,
              Buffer.from(parts[2], 'base64url'),
            );
            const now = Math.floor(Date.now() / 1000);
            if (!signatureValid) throw new Error('invalid signature');
            if (claims.iss !== expectedIssuer) throw new Error('issuer mismatch');
            if (claims.aud !== expectedAudience) throw new Error('audience mismatch');
            if (claims.sub !== expectedProtectedSubject) throw new Error('subject mismatch');
            if (claims.environment !== expectedTwinEnvironment) throw new Error('unexpected source environment');
            if (!Number.isFinite(claims.nbf) || !Number.isFinite(claims.exp)) throw new Error('token time claims missing');
            if (claims.nbf > now || claims.exp <= now) throw new Error('token is not current');
            return claims;
          }

          (async () => {
            const envelope = JSON.parse(fs.readFileSync('/tmp/rp-request/oidc-rp-request.json', 'utf8'));
            if (envelope.version !== 1) throw new Error('unsupported envelope');
            const privateKeyPem = Buffer.from(process.env.RP_PRIVATE_KEY_B64, 'base64').toString('utf8');
            if (!privateKeyPem.includes('BEGIN PRIVATE KEY')) throw new Error('RP private key missing');
            const aesKey = crypto.privateDecrypt(
              { key: privateKeyPem, oaepHash: 'sha256' },
              Buffer.from(envelope.key, 'base64'),
            );
            const decipher = crypto.createDecipheriv(
              'aes-256-gcm',
              aesKey,
              Buffer.from(envelope.iv, 'base64'),
            );
            decipher.setAuthTag(Buffer.from(envelope.tag, 'base64'));
            const plaintext = Buffer.concat([
              decipher.update(Buffer.from(envelope.ciphertext, 'base64')),
              decipher.final(),
            ]);
            const request = JSON.parse(plaintext.toString('utf8'));
            if (`${request.source_run_id}` !== process.env.SOURCE_RUN_ID) throw new Error('source run mismatch');
            if (!/^owned-write-[a-f0-9]{12}$/.test(request.requested_value)) {
              throw new Error('requested value is not an inert owned-write nonce');
            }
            const claims = await verifyJwt(request.jwt);
            const marker = process.env.RP_MARKER;
            if (!/^owned-cross-run-marker-[a-f0-9]{48}$/.test(marker)) throw new Error('RP marker missing');

            const commentId = process.env.RP_COMMENT_ID;
            if (!/^\d+$/.test(commentId)) throw new Error('RP comment ID missing');
            const commentPath = `/repos/${process.env.GITHUB_REPOSITORY}/issues/comments/${commentId}`;
            const before = await githubApi('GET', commentPath);
            if (before.body !== baselineState) throw new Error('RP state is not at baseline');

            let stateAfter;
            let restored;
            let mutationAttempted = false;
            try {
              mutationAttempted = true;
              await githubApi('PATCH', commentPath, { body: request.requested_value });
              const changed = await githubApi('GET', commentPath);
              stateAfter = changed.body;
              if (stateAfter !== request.requested_value) throw new Error('RP state write did not persist');
            } finally {
              if (mutationAttempted) {
                await githubApi('PATCH', commentPath, { body: baselineState });
                const finalState = await githubApi('GET', commentPath);
                restored = finalState.body;
                if (restored !== baselineState) throw new Error('RP state restoration failed');
              }
            }

            const response = {
              rp_exchange_succeeded: true,
              signature_valid: true,
              authenticated_sub: claims.sub,
              actual_environment: claims.environment,
              actor_id: claims.actor_id,
              source_run_id: request.source_run_id,
              pr_number: request.pr_number,
              protected_marker: marker,
              marker_sha256: crypto.createHash('sha256').update(marker).digest('hex'),
              protected_read_authorized: true,
              attacker_requested_value: request.requested_value,
              protected_write_authorized: true,
              state_before: before.body,
              state_after: stateAfter,
              state_restored: restored === baselineState,
              restored_state: restored,
              comment_url: before.html_url,
            };
            fs.writeFileSync('/tmp/oidc-rp-response.json', JSON.stringify(response, null, 2));
            console.log(JSON.stringify({
              rp_exchange_succeeded: true,
              signature_valid: true,
              actual_environment: claims.environment,
              actor_id: claims.actor_id,
              source_run_id: request.source_run_id,
              pr_number: request.pr_number,
              marker_sha256: response.marker_sha256,
              attacker_requested_value: request.requested_value,
              protected_write_authorized: true,
              state_before: before.body,
              state_after: stateAfter,
              state_restored: response.state_restored,
              restored_state: restored,
              comment_url: before.html_url,
            }));
          })().catch((error) => {
            console.error(`RP_ERROR=${error.message}`);
            process.exitCode = 1;
          });
          NODE

      - name: Publish the authorized RP response for the outside account
        uses: actions/upload-artifact@v4
        with:
          name: oidc-rp-response-${{ github.event.workflow_run.id }}
          path: /tmp/oidc-rp-response.json
          if-no-files-found: error
          retention-days: 1

