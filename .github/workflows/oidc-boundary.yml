name: Protected OIDC boundary control

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  policy-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: 'Critical%3AProd'
    steps:
      - name: Verify signature and emulate exact-sub trust policy
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto = require('crypto');
          const https = require('https');

          function getJson(url, headers = {}) {
            return new Promise((resolve, reject) => {
              const request = https.get(url, { headers }, (response) => {
                let body = '';
                response.setEncoding('utf8');
                response.on('data', (chunk) => { body += chunk; });
                response.on('end', () => {
                  if (response.statusCode < 200 || response.statusCode >= 300) {
                    reject(new Error(`HTTP ${response.statusCode}`));
                    return;
                  }
                  try {
                    resolve(JSON.parse(body));
                  } catch (error) {
                    reject(error);
                  }
                });
              });
              request.on('error', reject);
            });
          }

          (async () => {
            const audience = 'urn:owned:oidc-protected-boundary';
            const tokenResponse = await getJson(
              `${process.env.ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${encodeURIComponent(audience)}`,
              { Authorization: `bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` },
            );
            const parts = tokenResponse.value.split('.');
            if (parts.length !== 3) throw new Error('unexpected JWT structure');

            const header = JSON.parse(Buffer.from(parts[0], 'base64url').toString('utf8'));
            const claims = JSON.parse(Buffer.from(parts[1], 'base64url').toString('utf8'));
            if (header.alg !== 'RS256') throw new Error(`unexpected alg ${header.alg}`);

            const discovery = await getJson('https://token.actions.githubusercontent.com/.well-known/openid-configuration');
            const jwks = await getJson(discovery.jwks_uri);
            const jwk = jwks.keys.find((candidate) => candidate.kid === header.kid);
            if (!jwk) throw new Error('signing key not found');

            const publicKey = crypto.createPublicKey({ key: jwk, format: 'jwk' });
            const signatureValid = crypto.verify(
              'RSA-SHA256',
              Buffer.from(`${parts[0]}.${parts[1]}`),
              publicKey,
              Buffer.from(parts[2], 'base64url'),
            );

            const trustedProtectedSubject =
              'repo:Per0x1de-1337@162025236/codex-oidc-injectivity-20261106154500@1448444049:environment:Critical%3AProd';
            const exactTrustedSubjectMatch = claims.sub === trustedProtectedSubject;
            const wouldGrant = signatureValid
              && claims.iss === 'https://token.actions.githubusercontent.com'
              && claims.aud === audience
              && exactTrustedSubjectMatch;

            const marker = {
              signature_valid: signatureValid,
              actual_environment: claims.environment,
              protected_environment: 'Critical:Prod',
              exact_trusted_sub_match: exactTrustedSubjectMatch,
              would_grant: wouldGrant,
              sub: claims.sub,
              ref: claims.ref,
              actor_id: claims.actor_id,
              aud: claims.aud,
            };
            console.log(`OIDC_POLICY_DECISION=${JSON.stringify(marker)}`);
            if (!wouldGrant) process.exitCode = 1;
          })().catch((error) => {
            console.error(`OIDC_POLICY_ERROR=${error.message}`);
            process.exitCode = 1;
          });
          NODE
